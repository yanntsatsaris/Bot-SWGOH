[pytest]
testpaths = tests
asyncio_mode = auto
# seleniumbase n'est utilisé que par les workers de scraping, jamais par les
# tests. Son plugin pytest et le pytest-html qu'il tire (qui importe
# pkg_resources, absent depuis Python 3.12) sont désactivés ici.
addopts = -q --strict-markers -p no:seleniumbase -p no:html
